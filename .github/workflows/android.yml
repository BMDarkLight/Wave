name: Android Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
        include:
          - arch: arm64-v8a
            rust-target: aarch64-linux-android
            tauri-target: aarch64
          - arch: armeabi-v7a
            rust-target: armv7-linux-androideabi
            tauri-target: armv7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `packages` must not include the obsolete `tools` package that this
      # action still installs by default: it was removed from the Android SDK
      # repository, so sdkmanager exits non-zero and fails the job.
      #
      # This step only prepares the SDK. The NDK and platform come from the
      # runner image -- `api-level` and `ndk-version` are NOT inputs of
      # setup-android@v3 and were being ignored with a warning, so they have
      # been dropped rather than left in place implying a pin that never
      # existed. To pin the NDK for real, add `ndk;27.2.12479018` (r27c) to
      # `packages` and point ANDROID_NDK_ROOT at it in the step below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: "11076708"

      - name: Set up NDK toolchain
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

          # The NDK is whatever the runner image ships; log it so a version
          # bump is visible here rather than surfacing as a link error later.
          echo "Using NDK at $ANDROID_NDK_ROOT"
          cat "$ANDROID_NDK_ROOT/source.properties" 2>/dev/null || true
          
          # Set up toolchain for each architecture
          # Note: Rust target triples map to clang tools as follows:
          # aarch64-linux-android -> aarch64-linux-android34-clang
          # armv7-linux-androideabi -> armv7a-linux-androideabi34-clang
          if [ "${{ matrix.arch }}" = "arm64-v8a" ]; then
            RUST_TARGET="aarch64-linux-android"
            CLANG_TARGET="aarch64-linux-android"
            ANDROID_ABI="arm64-v8a"
          else
            RUST_TARGET="armv7-linux-androideabi"
            CLANG_TARGET="armv7a-linux-androideabi"
            ANDROID_ABI="armeabi-v7a"
          fi
          
          TOOLCHAIN_DIR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CC="${TOOLCHAIN_DIR}/${CLANG_TARGET}34-clang"
          CXX="${TOOLCHAIN_DIR}/${CLANG_TARGET}34-clang++"
          AR="${TOOLCHAIN_DIR}/llvm-ar"
          
          echo "CC_${RUST_TARGET//-/_}=${CC}" >> $GITHUB_ENV
          echo "CXX_${RUST_TARGET//-/_}=${CXX}" >> $GITHUB_ENV
          echo "AR_${RUST_TARGET//-/_}=${AR}" >> $GITHUB_ENV
          echo "CARGO_TARGET_${RUST_TARGET//-/_}_LINKER=${CC}" >> $GITHUB_ENV
          
          # Add toolchain to PATH
          echo "${TOOLCHAIN_DIR}" >> $GITHUB_PATH
          
          # Export sysroot for cargo
          echo "ANDROID_SYSROOT=${SYSROOT}" >> $GITHUB_ENV
          echo "SYSROOT=${SYSROOT}" >> $GITHUB_ENV
          
          # Write .cargo/config.toml so cargo picks up the Android NDK linker.
          # Environment variables alone are not propagated through the Gradle
          # build chain invoked by tauri-action, so a config file is required.
          #
          # Use clang++ as the linker so the C++ standard library and ABI
          # symbols (operator new/delete, __cxa_*, std::terminate, etc.)
          # required by oboe_sys are resolved automatically.
          LIB_DIR="${SYSROOT}/usr/lib/${ANDROID_ABI}"
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << EOF
          [target.${RUST_TARGET}]
          linker = "${CXX}"
          rustflags = [
              "-C", "link-arg=-L${LIB_DIR}",
              "-C", "link-arg=-llog",
              "-C", "link-arg=-lOpenSLES",
              "-C", "link-arg=-landroid",
              "-C", "link-arg=-lunwind",
          ]
          EOF

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            xdg-utils \
            libxdo-dev \
            libxdo3 \
            xdotool

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Initialize Tauri Android
        run: npx tauri android init

      # Turns the stock Tauri project into Wave's app: Java sources, icons,
      # manifest patches, Media3 deps and JNI keep rules. Local builds run the
      # same script; see "Android" under Getting started in the README.
      - name: Configure Android project
        run: bash ./scripts/configure-android.sh

      # Signs release APKs via keystore.properties + Gradle signingConfigs.
      # Secrets: ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Optional: ANDROID_STORE_PASSWORD (defaults to ANDROID_KEY_PASSWORD)
      - name: Setup Android signing
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEY_BASE64}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Skipping Android signing (signing secrets not available for this PR)."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Missing Android signing secrets. Set ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          bash ./scripts/setup-android-signing.sh
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri Android App
        run: npx tauri android build --target ${{ matrix.tauri-target }}

      - name: Verify APK signatures
        if: steps.signing.outputs.enabled == 'true'
        run: |
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APKs found to verify"
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            # Unsigned release APKs fail this check.
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wave-android-${{ matrix.arch }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

  # On a v* tag, attach both APKs to the draft release that build.yml makes.
  # Each is named for its ABI: the in-app updater picks the asset ending in
  # _<abi>.apk for the phone it runs on, so keep this naming in step with
  # src-tauri/src/app/updater.rs.
  publish-apks:
    name: Attach APKs to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          pattern: wave-android-*
          path: apks

      - name: Upload them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a; do
            mapfile -t found < <(find "apks/wave-android-$abi" -name '*.apk')
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected one APK for $abi, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" "out/Wave_${VERSION}_${abi}.apk"
          done
          ls -l out

          # build.yml creates the draft release when its first desktop build
          # finishes. Wait for it instead of racing it with a second draft.
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::No release for $TAG after an hour"
              exit 1
            fi
            echo "Waiting for the $TAG release ($attempt/60)"
            sleep 60
          done
          gh release upload "$TAG" out/*.apk --clobber
