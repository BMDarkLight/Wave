name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb, rpm and AppImage
          - os: ubuntu-latest
            label: linux-x86_64
            target: ''
            args: ''
          # NSIS installer (.exe)
          - os: windows-latest
            label: windows-x86_64
            target: ''
            args: ''
          # .app + .dmg, Apple silicon
          - os: macos-latest
            label: macos-aarch64
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # .app + .dmg, Intel
          - os: macos-latest
            label: macos-x86_64
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ./src-tauri -> target
        key: ${{ matrix.label }}

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libasound2-dev \
          patchelf \
          xdg-utils \
          libxdo-dev \
          libxdo3 \
          xdotool \
          rpm \
          desktop-file-utils \
          appstream

    - name: Configure Linux native library path
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        XDO_LIBRARY="$(ldconfig -p | awk '/libxdo\.so\.3/{print $NF; exit}')"
        if [ -z "$XDO_LIBRARY" ] || [ ! -f "$XDO_LIBRARY" ]; then
          echo "::error::libxdo.so.3 was not installed"
          exit 1
        fi
        mkdir -p "$GITHUB_WORKSPACE/.ci-native-libs"
        ln -sf "$XDO_LIBRARY" "$GITHUB_WORKSPACE/.ci-native-libs/libxdo.so"
        echo "LIBRARY_PATH=$GITHUB_WORKSPACE/.ci-native-libs:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-Lnative=$GITHUB_WORKSPACE/.ci-native-libs ${RUSTFLAGS:-}" >> "$GITHUB_ENV"

    - name: Validate AppStream metainfo
      if: matrix.os == 'ubuntu-latest'
      run: appstreamcli validate --no-net packaging/linux/app.bmdarklight.wave.metainfo.xml

    - name: Install npm dependencies
      run: npm ci

    # Release builds also make the signed packages the in-app updater
    # installs, and tauri-action lists them in latest.json on the release.
    # Branch and PR builds skip them, so they need no signing key.
    - name: Turn on signed update packages
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      run: |
        if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
          echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so the update packages can't be signed."
          exit 1
        fi
        node -e '
          const fs = require("fs");
          const file = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
        '

    # Builds every installer for the platform. On a v* tag it also uploads them
    # to a draft GitHub Release; on branches and PRs tagName is empty, so the
    # packages are built and checked but nothing is published.
    - name: Build the app and its installers
      uses: tauri-apps/tauri-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        args: ${{ matrix.args }}
        tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        releaseName: Wave ${{ github.ref_name }}
        releaseDraft: true
        prerelease: false

    # Fails the build if the packaged app is not actually installable as one:
    # the binary has to be `wave` on PATH, and the desktop entry has to be valid.
    # Fails the build if the packaged app is not actually installable as one:
    # the binary has to be reachable as `wave` on PATH, and the desktop entry
    # has to be valid. Everything is printed before it is asserted, so a
    # failure here says what the package actually contains.
    # Fails the build if the packaged app is not actually installable as one:
    # the binary has to be reachable as `wave` on PATH, and the desktop entry
    # has to be valid.
    #
    # Checks run against real archive member names taken from the payload tar,
    # not against the formatted columns of `dpkg-deb -c`. Those columns vary:
    # the leading "./" is only present if the producer wrote it (Tauri builds
    # this tar itself), and symlink rows carry a trailing " -> target".
    - name: Verify the Linux packages
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        set -euo pipefail

        DEB="$(find src-tauri/target -type f -name '*.deb' -print -quit)"
        if [ -z "$DEB" ]; then
          echo "::error::No .deb was produced"
          exit 1
        fi
        echo "Inspecting $DEB"

        # Normalise to bare paths: "./usr/bin/wave" and "usr/bin/wave" both
        # become "usr/bin/wave". Directories keep their trailing slash.
        dpkg-deb --fsys-tarfile "$DEB" | tar -tf - | sed 's#^\./##'           | sed '/^$/d' | sort -u > /tmp/deb-paths.txt

        echo "== every path the package installs ($(wc -l < /tmp/deb-paths.txt) entries) =="
        cat /tmp/deb-paths.txt

        if ! grep -qx 'usr/bin/wave' /tmp/deb-paths.txt; then
          echo "::error::The package does not provide usr/bin/wave, so the CLI would not be on PATH."
          echo "Paths mentioning 'wave' (any case):"
          grep -i 'wave' /tmp/deb-paths.txt || echo "  (none)"
          exit 1
        fi
        echo "OK: the package provides /usr/bin/wave"

        echo "== declared dependencies =="
        dpkg-deb -f "$DEB"

        mkdir -p /tmp/deb && dpkg-deb -x "$DEB" /tmp/deb

        echo "== desktop entry =="
        # Discovered rather than assumed: the bundler chooses the filename.
        DESKTOP="$(find /tmp/deb/usr/share/applications -name '*.desktop' -print -quit 2>/dev/null || true)"
        if [ -z "$DESKTOP" ]; then
          echo "::error::No .desktop file in the package; the app would not appear in the app menu."
          exit 1
        fi
        echo "found: $DESKTOP"
        cat "$DESKTOP"
        desktop-file-validate "$DESKTOP"
        echo "OK: desktop entry is valid"

        # Exec= has to name the binary that is actually on PATH.
        if ! grep -qE '^Exec=wave( |$)' "$DESKTOP"; then
          echo "::error::Exec= in the desktop entry does not launch 'wave'."
          exit 1
        fi
        echo "OK: desktop entry launches wave"

        echo "== metainfo =="
        if ! grep -qx 'usr/share/metainfo/app.bmdarklight.wave.metainfo.xml' /tmp/deb-paths.txt; then
          echo "::error::metainfo is missing from the package."
          exit 1
        fi
        echo "OK: metainfo is installed"

    - name: Verify the Windows installer
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -euo pipefail
        echo "== the main binary must be lowercase wave.exe =="
        test -f src-tauri/target/release/wave.exe
        echo "== the PATH shim and its helper must be bundled =="
        test -f packaging/windows/wave.cmd
        test -f packaging/windows/wave-path.ps1
        find src-tauri/target -name '*-setup.exe' -print

    # Printed so the Homebrew cask, winget manifest and Chocolatey package can
    # be updated with real checksums straight from the release job's log.
    - name: Checksums
      shell: bash
      run: |
        set -euo pipefail
        echo "### ${{ matrix.label }} artifacts" >> "$GITHUB_STEP_SUMMARY"
        # macOS runners ship `shasum`, not GNU coreutils' `sha256sum`.
        if command -v sha256sum >/dev/null 2>&1; then
          sha() { sha256sum "$1"; }
        else
          sha() { shasum -a 256 "$1"; }
        fi
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        find src-tauri/target -type f \
          \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
             -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' \) \
          -print0 |
          while IFS= read -r -d '' f; do
            sha "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wave-${{ matrix.label }}
        path: |
          src-tauri/target/release/bundle/
          src-tauri/target/*/release/bundle/
        if-no-files-found: error

  # Every build job adds its platform to latest.json on the draft release.
  # Before the draft is published, make sure none of them went missing, or
  # that platform would never be offered the update.
  updater-manifest:
    name: Check latest.json
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    # On a draft, tauri-action can only link API asset URLs, which count
    # against GitHub's 60 requests an hour for anonymous callers. Point them
    # at the release download links instead, which work once the draft is
    # published. Immutable releases rule this out after publishing.
    - name: Link latest.json to the release downloads
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/updater
        gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
          --jq "[.[] | select(.tag_name == \"$TAG\") | .assets[] | {key: (.id | tostring), value: .name}] | from_entries" \
          > /tmp/updater/assets.json
        jq --slurpfile names /tmp/updater/assets.json \
           --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" '
          .platforms |= with_entries(
            ((.value.url | capture("/releases/assets/(?<id>[0-9]+)$") | .id) // null) as $id
            | if $id != null and $names[0][$id] then .value.url = $base + $names[0][$id] else . end)
        ' /tmp/updater/latest.json > /tmp/updater/linked.json
        mv /tmp/updater/linked.json /tmp/updater/latest.json
        gh release upload "$TAG" /tmp/updater/latest.json --clobber --repo "$GITHUB_REPOSITORY"

    - name: Check every platform is in latest.json
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        cat /tmp/updater/latest.json
        missing=0
        for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 \
                        linux-x86_64 linux-x86_64-deb linux-x86_64-rpm; do
          if ! jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' \
              /tmp/updater/latest.json > /dev/null; then
            echo "::error::latest.json has no signed package for $platform. Re-run that build job."
            missing=1
          fi
        done
        if [ "$(jq -r .version /tmp/updater/latest.json)" != "${TAG#v}" ]; then
          echo "::error::latest.json is not for $TAG."
          missing=1
        fi
        exit "$missing"
