<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Wave - Music Player</title>
    <script>
      // Android WebView often reports hover:hover, so sticky :hover CSS would
      // otherwise apply. Mark early — before module JS — from UA / media.
      (function () {
        try {
          var touch =
            /Android/i.test(navigator.userAgent || "") ||
            window.matchMedia("(hover: none), (pointer: coarse)").matches;
          if (touch) document.documentElement.classList.add("wave-no-hover");
        } catch (_) {}
      })();
      // Start in the theme the last launch showed, or the system's on the
      // first one, so the page does not flash the other theme while the
      // saved setting loads.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("wave-theme");
        } catch (_) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#ffffff");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
