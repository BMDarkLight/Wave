ShortDescription: Lightweight offline-first music player
Description: |-
  Wave is a lightweight, cross-platform, offline-first music player. It keeps
  your local library fast to browse, runs real audio DSP, and shows synced
  lyrics, with an optional tier of free online catalogs that is off by default.

  The installer also puts a `wave` command on PATH, giving you the full
  command-line interface for managing the library, playback, queue, metadata
  and listening stats from a terminal.
